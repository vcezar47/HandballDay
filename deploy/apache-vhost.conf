# Apache site for HandballDay. Copy to /etc/apache2/sites-available/handballday.conf, replace the two
# placeholders, then:
#   a2enmod rewrite proxy proxy_http headers deflate expires ssl
#   a2ensite handballday && systemctl reload apache2
#   certbot --apache -d YOUR.DOMAIN.EXAMPLE      (adds the HTTPS vhost and keeps the HTTP -> HTTPS redirect)
#
# DocumentRoot is the built frontend. Everything about routing, headers and caching lives in the
# .htaccess inside it (frontend/public/.htaccess), which is why AllowOverride is All.

<VirtualHost *:80>
    ServerName YOUR.DOMAIN.EXAMPLE
    DocumentRoot /opt/handballday/frontend/dist

    <Directory /opt/handballday/frontend/dist>
        AllowOverride All
        Require all granted
    </Directory>

    # Defence in depth for the 12 MB upload cap: the app refuses larger bodies itself (barem 9.04).
    <Location "/api/uploads">
        LimitRequestBody 12582912
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/handballday-error.log
    CustomLog ${APACHE_LOG_DIR}/handballday-access.log combined
</VirtualHost>
