# Server-wide settings that .htaccess cannot change. Install with:
#   cp deploy/apache-hardening.conf /etc/apache2/conf-available/zz-handballday-hardening.conf
#   a2enconf zz-handballday-hardening   (zz: loads after Ubuntu's security.conf, which would otherwise win) && systemctl reload apache2
ServerTokens Prod
ServerSignature Off
TraceEnable Off
